# Builds the Windows installer + auto-updater artifacts and publishes them
# as a GitHub Release, triggered by pushing a `vX.Y.Z` tag.
#
# GitHub is the canonical remote (this repo used to live on a self-hosted
# GitLab, mirrored here -- switched away after mirrored pushes turned out
# not to trigger this workflow at all, never fully root-caused; a direct
# push from GitHub-as-origin works reliably).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY          -- contents of app/.tauri-keys/syncaudio.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD -- the password chosen when generating it
#     (empty string is fine if none was set)
# `GITHUB_TOKEN` is provided automatically, no setup needed.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v10

      - name: Install engine dependencies
        working-directory: engine
        run: uv sync

      - name: Run engine tests
        working-directory: engine
        run: uv run pytest -q

      - name: Build the engine sidecar (PyInstaller -> app/src-tauri/binaries)
        working-directory: engine
        run: uv run python packaging/build_sidecar.py

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # If a "STATIC_VCRUNTIME is deprecated" warning still shows up here,
      # it's not from this repo or from tauri-action (checked: neither sets
      # it) -- something in the windows-latest runner's own base
      # environment does, which unconditionally overrides tauri.conf.json's
      # build.windows.staticVCRuntime (see tauri-build's own source:
      # env::var_os("STATIC_VCRUNTIME") wins whenever it's merely *present*,
      # regardless of value). GitHub Actions' `env:` block can only add/
      # override variables, not delete one already set by the runner, so
      # there's no clean way to silence it from here -- harmless either way,
      # the build still links the VC runtime the way we want.
      - name: Build and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "SyncAudio ${{ github.ref_name }}"
          # Draft: reviewed and published by hand once, not auto-public the
          # instant a build succeeds -- flip to false once that extra step
          # stops being wanted.
          releaseDraft: true
          prerelease: false
