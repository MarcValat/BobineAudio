# Builds the Windows and Linux installers + auto-updater artifacts and
# publishes them as a GitHub Release, triggered by pushing a `vX.Y.Z` tag.
# A pull request that changes how they're built (this file, the engine's
# packaging) builds both too, without publishing anything: the installers
# are attached to the run as artifacts, to try before merging. So does a
# manual run (Actions > Release > Run workflow). Not a version bump's pull
# request: its tag builds the release right after anyway.
#
# GitHub is the canonical remote (this repo used to live on a self-hosted
# GitLab, mirrored here -- switched away after mirrored pushes turned out
# not to trigger this workflow at all, never fully root-caused; a direct
# push from GitHub-as-origin works reliably).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY          -- contents of app/.tauri-keys/syncaudio.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD -- the password chosen when generating it
#     (empty string is fine if none was set)
# `GITHUB_TOKEN` is provided automatically, no setup needed.
name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "engine/packaging/**"
  workflow_dispatch:

jobs:
  # One draft release for both platforms to upload to, created up front: two
  # build jobs each creating it when they finish could race into two.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # Draft: reviewed and published by hand once, not auto-public the
        # instant a build succeeds.
        run: |
          gh release create "$TAG" --draft --verify-tag --title "SyncAudio $TAG" --notes ""
          id=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # Also when create-release was skipped (a pull request or a manual run).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          # The oldest supported Ubuntu: the AppImage then runs on as many
          # distributions as possible (it needs a glibc at least as recent
          # as the one it was built against).
          - platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      # Published builds get the fullest optimization; Cargo.toml keeps
      # cheaper settings for local builds (see its [profile.release]).
      CARGO_PROFILE_RELEASE_LTO: "fat"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies (WebKitGTK, AppImage tooling)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Install engine dependencies
        working-directory: engine
        run: uv sync

      - name: Run engine tests
        working-directory: engine
        run: uv run pytest -q

      # PyInstaller only builds for the system it runs on: each platform
      # freezes its own engine.
      - name: Build the engine sidecar (PyInstaller folder -> app/src-tauri/binaries/syncaudio-engine)
        working-directory: engine
        run: uv run python packaging/build_sidecar.py

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # If a "STATIC_VCRUNTIME is deprecated" warning still shows up here on
      # Windows, that's expected and harmless -- confirmed (by comparing a
      # plain `cargo check` against a real `tauri build` locally) that the
      # Tauri CLI itself sets that env var internally, likely its own
      # backward-compat bridge for build.rs scripts, since this CLI
      # version's config schema doesn't actually support tauri.conf.json's
      # documented build.windows.staticVCRuntime replacement yet either (see
      # build.rs, which uses the Rust-side WindowsAttributes API instead --
      # that one *is* honored by tauri-build, just not by this particular
      # warning).
      #
      # Each job adds its installers, and its platform's entry in
      # latest.json, to the draft release.
      - name: Build and publish to the release
        if: needs.create-release.outputs.release_id != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles ${{ matrix.bundles }}

      - name: Build only (pull request or manual run)
        if: needs.create-release.outputs.release_id == ''
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --bundles ${{ matrix.bundles }}

      - name: Attach the installers to the run
        if: needs.create-release.outputs.release_id == ''
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
