[package]
name = "syncaudio"
version = "1.5.0"
description = "Resynchronise les pistes audio multilingues d'un MKV"
authors = ["Marc Valat"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "syncaudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
# Already in the dependency tree via tauri; used for the kill-on-close Job
# Object that ties the sidecar's lifetime to this process (see lib.rs).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
#
# Thin LTO and parallel codegen here, for local `tauri build`s that finish in
# a fraction of the time. The release workflow overrides both back to the
# smallest/fastest settings (fat LTO, one codegen unit) through
# CARGO_PROFILE_RELEASE_* variables (.github/workflows/release.yml), so
# published installers are built exactly as before.
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
